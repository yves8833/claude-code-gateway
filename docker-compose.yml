services:
  api:
    build: .
    expose:
      - "8080"
    volumes:
      - ~/.claude/.credentials.json:/root/.claude/.credentials.json
    environment:
      - CCG_HOST=0.0.0.0
      - CCG_PORT=8080
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-ccg-secret-change-me}
    depends_on:
      - api
    restart: unless-stopped
